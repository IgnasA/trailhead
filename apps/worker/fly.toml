# Fly.io config for the import worker (ADR 0001). App not created yet —
# `fly launch --no-deploy` from apps/worker/ will adopt this file; then set
# DATABASE_URL (Supabase pooler URL) with `fly secrets set`.
app = "trailhead-worker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

# No public services: the worker only dials out (Postgres, Gmail, Anthropic).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

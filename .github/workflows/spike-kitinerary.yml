# M2 spike: can kitinerary-extractor run on the worker's Debian base?
# Answers the Docker question from the build plan before M2 hardens.
# Throwaway — delete once tracker ticket 017 records the verdict.
name: Spike kitinerary
on:
  push:
    branches: [m2/import-pipeline]
    paths: [".github/workflows/spike-kitinerary.yml"]
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - name: kitinerary on Debian bookworm (worker base)
        run: |
          cat > /tmp/sample.html <<'HTML'
          <html><head><script type="application/ld+json">
          {"@context":"https://schema.org","@type":"FlightReservation",
           "reservationNumber":"7QK4RB",
           "reservationFor":{"@type":"Flight","flightNumber":"710",
             "airline":{"@type":"Airline","iataCode":"LH","name":"Lufthansa"},
             "departureAirport":{"@type":"Airport","iataCode":"FRA","name":"Frankfurt"},
             "arrivalAirport":{"@type":"Airport","iataCode":"NRT","name":"Narita"},
             "departureTime":"2025-06-14T17:05:00+02:00",
             "arrivalTime":"2025-06-15T11:40:00+09:00"}}
          </script></head><body>Your Lufthansa booking confirmation</body></html>
          HTML
          docker run --rm -v /tmp/sample.html:/sample.html alpine:3.21 sh -c '
            apk update -q >/dev/null 2>&1 || true
            echo "=== alpine search ==="
            apk search -q kitinerary || true
            apk search -q itinerary || true
            if apk add -q kitinerary >/dev/null 2>&1; then
              echo "=== alpine installed kitinerary ==="
              which kitinerary-extractor && kitinerary-extractor /sample.html || true
              du -sh /usr
            else
              echo "=== alpine: kitinerary NOT installable ==="
            fi
          ' || true
          for base in debian:trixie-slim debian:bookworm-slim; do
            echo "########## $base ##########"
            docker run --rm -v /tmp/sample.html:/sample.html "$base" bash -c '
              apt-get update -q >/dev/null 2>&1
              echo "=== packages matching itinerary ==="
              apt-cache search itinerary || true
              if apt-get install -y -q kitinerary-extractor >/dev/null 2>&1; then
                echo "=== installed OK ==="
                echo "=== extraction of schema.org sample ==="
                kitinerary-extractor /sample.html || cat /sample.html | kitinerary-extractor || true
                echo "=== install size ==="
                du -sh /usr 2>/dev/null
              else
                echo "=== kitinerary-extractor NOT installable on this base ==="
              fi
            ' || true
          done

# Deploys the import worker to Fly. Manual-only until the Fly app exists
# (create it with `fly launch --no-deploy` in apps/worker/, then add the
# FLY_API_TOKEN repo secret and switch the trigger to push-on-main).
name: Deploy worker
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
